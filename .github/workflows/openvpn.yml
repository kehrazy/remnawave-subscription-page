name: OpenVPN subscriptions
on:
  push:
    branches: [openvpn]
  workflow_dispatch:
concurrency:
  group: openvpn-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        working-directory: backend
      - run: npx tsc --noEmit
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run start:build
        working-directory: frontend
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: remnawave-subscription-openvpn:${{ github.sha }}
          outputs: type=docker,dest=/tmp/remnawave-subscription-openvpn.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish image archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -1 /tmp/remnawave-subscription-openvpn.tar
          cd /tmp
          sha256sum remnawave-subscription-openvpn.tar.gz > remnawave-subscription-openvpn.tar.gz.sha256
          gh release create "openvpn-${GITHUB_SHA}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "OpenVPN ${GITHUB_SHA:0:12}" --notes "Subscription page with per-user OpenVPN downloads."
          gh release upload "openvpn-${GITHUB_SHA}" remnawave-subscription-openvpn.tar.gz remnawave-subscription-openvpn.tar.gz.sha256 --repo "$GITHUB_REPOSITORY"
